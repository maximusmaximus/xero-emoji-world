server {
  listen 80;
  root /usr/share/nginx/html;
  location / { try_files $uri /index.html; }
  location /api/ { proxy_pass http://sim-server:8787; proxy_buffering off; }
  location /events { proxy_pass http://sim-server:8787; proxy_buffering off; proxy_read_timeout 1d; }
  location /ws { proxy_pass http://sim-server:8787; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 1d; }
}
